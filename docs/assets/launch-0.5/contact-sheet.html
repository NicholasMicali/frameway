<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frameway launch contact sheet</title>
    <style>
      @font-face {
        font-family: Manrope;
        src: url('../../../public/fonts/manrope.ttf');
      }
      @font-face {
        font-family: Source;
        src: url('../../../public/fonts/sourcesans3.ttf');
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e7edf3;
        color: #172638;
        font:
          18px Source,
          sans-serif;
        padding: 40px;
        width: 1400px;
      }
      h1 {
        font: 800 32px Manrope;
        margin: 0 0 10px;
      }
      header p {
        margin: 0 0 28px;
        color: #58697b;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
      }
      figure {
        margin: 0;
        background: white;
        border: 1px solid #c6d5e2;
        border-radius: 8px;
        overflow: hidden;
      }
      .preview {
        height: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #dce5ee;
      }
      .preview img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        display: block;
      }
      figcaption {
        padding: 14px 18px;
      }
      b {
        font-family: Manrope;
        font-size: 16px;
      }
      span {
        display: block;
        color: #58697b;
        font-size: 16px;
        margin-top: 5px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Frameway / Launch 0.5</h1>
      <p>CRM Training example · current Frameway 0.5 UI · click a preview for its full-size PNG</p>
    </header>
    <main>
      <figure>
        <a class="preview" href="renders/01-walkthrough.png"
          ><img src="renders/01-walkthrough.png" alt="Turn your screen into a walkthrough"
        /></a>
        <figcaption>
          <b>01-walkthrough · Turn your screen into a walkthrough</b><span>1280 × 800</span>
        </figcaption>
      </figure>
      <figure>
        <a class="preview" href="renders/02-capture.png"
          ><img src="renders/02-capture.png" alt="Capture clicks as you work"
        /></a>
        <figcaption>
          <b>02-capture · Capture clicks as you work</b><span>1280 × 800</span>
        </figcaption>
      </figure>
      <figure>
        <a class="preview" href="renders/03-edit.png"
          ><img src="renders/03-edit.png" alt="Make every step clear"
        /></a>
        <figcaption><b>03-edit · Make every step clear</b><span>1280 × 800</span></figcaption>
      </figure>
      <figure>
        <a class="preview" href="renders/04-share.png"
          ><img src="renders/04-share.png" alt="Share something people can use"
        /></a>
        <figcaption>
          <b>04-share · Share something people can use</b><span>1280 × 800</span>
        </figcaption>
      </figure>
      <figure>
        <a class="preview" href="renders/05-local.png"
          ><img src="renders/05-local.png" alt="Your work stays local"
        /></a>
        <figcaption><b>05-local · Your work stays local</b><span>1280 × 800</span></figcaption>
      </figure>
      <figure>
        <a class="preview" href="renders/06-promo.png"
          ><img src="renders/06-promo.png" alt="Small promo tile"
        /></a>
        <figcaption><b>06-promo · Small promo tile</b><span>440 × 280</span></figcaption>
      </figure>
      <figure>
        <a class="preview" href="renders/07-marquee.png"
          ><img src="renders/07-marquee.png" alt="Optional marquee"
        /></a>
        <figcaption>
          <b>07-marquee · Optional marquee</b><span>1400 × 560 · optional</span>
        </figcaption>
      </figure>
      <figure>
        <a class="preview" href="renders/08-social.png"
          ><img src="renders/08-social.png" alt="Social image"
        /></a>
        <figcaption><b>08-social · Social image</b><span>1200 × 630</span></figcaption>
      </figure>
    </main>
  </body>
</html>
